name: Build Antigravity APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: JDK 17 ornatish
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Go tilini ornatish (agy_ide_bridge uchun)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go bridge binarini yigish (agar mavjud bolsa)
        run: |
          if [ -d "agy_ide_bridge" ]; then
            cd agy_ide_bridge
            GOOS=android GOARCH=arm64 go build -o ../app/src/main/assets/agy_bridge . || true
            cd ..
          fi

      - name: Debug APK yigish (Avto-imzolangan)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Tayyor APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
